services:
  mariadb:
    image: mariadb:12
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      #- mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d   # Dev. Sin carga persistente
    networks:
      - app-network

  backend:
    build: ./apps/backend
    env_file:
      - ./.env
    container_name: backend
    depends_on:
      - mariadb
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - app-network

  frontend:
    build: ./apps/frontend/incident-manager
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - app-network

volumes:
  mariadb_data:

networks:
  app-network:
